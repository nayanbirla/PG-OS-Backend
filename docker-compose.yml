version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: pg-os-db
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: PG_OS
      POSTGRES_USER: nbirla
      POSTGRES_PASSWORD: Nayan@1234
    volumes:
      - pg-os-data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pg-os-pgadmin
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: nayanbirla9893@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    depends_on:
      - postgres

volumes:
  pg-os-data: