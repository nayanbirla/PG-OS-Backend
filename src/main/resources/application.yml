spring:
  application:
    name: pg-os
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/PG_OS}
    username: ${DB_USER:nbirla}
    password: ${DB_PASSWORD:Nayan@1234}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: 8081

app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-at-least-32-chars}
    access-token-minutes: 15
    refresh-token-days: 30
  admin:
    email: ${ADMIN_EMAIL:admin@pgos.local}
    phone: ${ADMIN_PHONE:0000000000}
    password: ${ADMIN_PASSWORD:9876543210}
  timezone: Asia/Kolkata
  jobs:
    daily-cron: 0 5 0 * * *   # 00:05 every day
